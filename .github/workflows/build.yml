name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          MARINE_KEY: ${{ secrets.MARINE_SIGNING_KEY }}
        run: |
          if [ -z "$MARINE_KEY" ]; then
            echo "::error::Configure MARINE_SIGNING_KEY repository secret before building"
            exit 1
          fi
          MARINE_KEYSTORE_PATH="$RUNNER_TEMP/marinegps-signing.jks"
          echo "MARINE_KEYSTORE_PATH=$MARINE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$MARINE_KEY" | base64 --decode > "$MARINE_KEYSTORE_PATH"
          chmod 600 "$MARINE_KEYSTORE_PATH"
          keytool -list -keystore "$MARINE_KEYSTORE_PATH" -storepass android -alias androiddebugkey >/dev/null
          actual=$(keytool -exportcert -keystore "$MARINE_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d" " -f1)
          test "$actual" = "8280d01969ce8128fdb5940eea83010ec69385e9fdb6dc6ecfdeed07974106c9"
          echo "MARINE_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo "Restored certificate SHA-256: $actual"
      - name: Verify committed wreck dataset and dependency locks
        run: |
          set -euo pipefail
          echo "e84df0641bb4e5f45e1cf142c0eb23b40dd628025f268842e14ef258eadc0e6a  app/src/main/assets/wrecks-ukho.geojson" | sha256sum -c -
          test -s app/gradle.lockfile
      - name: Build APK with retry on rate limits
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace --max-workers=2 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -Eq '429|Too Many Requests' build.log || [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 60))
          done
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signing-report.txt
          grep -Fxi "Signer #1 certificate SHA-256 digest: $MARINE_CERT_SHA256" signing-report.txt
      - name: Verify offline APK manifest
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk > permissions.txt
          if grep -Fq android.permission.INTERNET permissions.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > apk-info.txt
          if grep -Fq application-debuggable apk-info.txt; then exit 1; fi
      - name: Compare independent clean release builds
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          cp "$apk" "$RUNNER_TEMP/first-release.apk"
          gradle :app:clean :app:testReleaseUnitTest :app:assembleRelease --no-build-cache --rerun-tasks --max-workers=2
          sha256sum "$RUNNER_TEMP/first-release.apk" "$apk" | tee reproducibility.txt
          if cmp -s "$RUNNER_TEMP/first-release.apk" "$apk"; then echo MATCH | tee -a reproducibility.txt; else echo DIFFERENT | tee -a reproducibility.txt; fi
      - name: Verify final rebuilt APK and test reports
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > signing-report.txt
          grep -Fxi "Signer #1 certificate SHA-256 digest: $MARINE_CERT_SHA256" signing-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-info.txt
          if grep -Fq android.permission.INTERNET permissions.txt || grep -Fq application-debuggable apk-info.txt; then exit 1; fi
          ls app/build/test-results/testReleaseUnitTest/*.xml
          python3 - <<'PY'
          import zipfile,hashlib,os
          with zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/first-release.apk") as a, zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk") as b:
              with open("apk-diff.txt","w") as f:
                  for n in sorted(set(a.namelist())|set(b.namelist())):
                      if n not in a.namelist() or n not in b.namelist() or a.read(n)!=b.read(n):
                          print(n,file=f)
          PY
          python3 research/compare_apks.py "$RUNNER_TEMP/first-release.apk" "$apk" > apk-metadata-diff.txt
      - name: Record build provenance
        run: |
          git rev-parse HEAD > build-provenance.txt
          java -version 2>> build-provenance.txt
          gradle --version >> build-provenance.txt
          sha256sum app/src/main/assets/wrecks-ukho.geojson app/build/outputs/apk/release/app-release.apk >> build-provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MarineGPS-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            signing-report.txt
            permissions.txt
            apk-info.txt
            build-provenance.txt
            reproducibility.txt
            apk-diff.txt
            apk-metadata-diff.txt
            app/src/main/assets/wrecks-ukho.geojson
            app/build/test-results/testReleaseUnitTest/*.xml
